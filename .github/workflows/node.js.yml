name: CI Checks

on:
  pull_request:
    branches: [ "staging", "prod", "main" ]
  push:
    branches: [ "staging", "prod", "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/prod' }}

permissions:
  contents: read

jobs:
  ci:
    name: CI Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js & cache pnpm dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Type check
        run: corepack pnpm run typecheck

      - name: Regression tests
        run: corepack pnpm run test

      - name: Lint (advisory / non-blocking)
        run: corepack pnpm run lint
        continue-on-error: true

      - name: OpenNext Cloudflare worker build
        run: corepack pnpm run build:worker
        env:
          SKIP_ENV_VALIDATION: "1"
          NODE_ENV: "production"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_d2FybS13YWxydXMtNDc4NS5jbGVyay5hY2NvdW50cy5kZXYk"
          NEXT_PUBLIC_POSTHOG_KEY: "phc_xuizP7wS5d8kYLAp9sPC5EU3uGt5aFxucvwMB53mUTae"
          NEXT_PUBLIC_POSTHOG_HOST: "https://us.i.posthog.com"
